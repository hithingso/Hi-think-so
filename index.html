<!-- Firebase App & Auth SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
getAuth,
signInWithPopup,
GoogleAuthProvider,
signInAnonymously,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// ⚠️ 請填入妳專屬的 Firebase 設定資訊
const firebaseConfig = {
apiKey: "YOUR_API_KEY",
authDomain: "hithingso.firebaseapp.com",
projectId: "hithingso",
storageBucket: "hithingso.appspot.com",
messagingSenderId: "YOUR_SENDER_ID",
appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

window.firebaseAuth = {
auth,
loginWithGoogle: async () => {
try {
await signInWithPopup(auth, googleProvider);
} catch (error) {
alert('Google 登入失敗：' + error.message);
}
},
loginAnonymously: async () => {
try {
await signInAnonymously(auth);
} catch (error) {
alert('訪客登入失敗：' + error.message);
}
},
logout: async () => {
try {
await signOut(auth);
} catch (error) {
alert('登出失敗：' + error.message);
}
}
};

// 監聽登入狀態變更
onAuthStateChanged(auth, (user) => {
const authOverlay = document.getElementById('auth-overlay');
const userDisplayName = document.getElementById('user-display-name');

if (user) {
authOverlay.classList.add('hidden');
if (user.isAnonymous) {
userDisplayName.textContent = '訪客朋友';
} else {
userDisplayName.textContent = user.displayName || '使用者';
}
} else {
authOverlay.classList.remove('hidden');
}
});
</script>
