<!-- Firebase SDKs & Auth -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
getAuth,
signInWithPopup,
GoogleAuthProvider,
signInAnonymously,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

// 妳專屬的真實 Firebase 設定
const firebaseConfig = {
apiKey: "AIzaSyDGWK0D48kx6QVUi2yzSHzx4KqPnj75F3k",
authDomain: "hi-think-so.firebaseapp.com",
projectId: "hi-think-so",
storageBucket: "hi-think-so.firebasestorage.app",
messagingSenderId: "308449614555",
appId: "1:308449614555:web:b163a60702928240298afe",
measurementId: "G-90TPZNFZ40"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

window.firebaseAuth = {
auth,
loginWithGoogle: async () => {
try {
await signInWithPopup(auth, googleProvider);
} catch (error) {
alert('Google 登入失敗：' + error.message);
}
},
loginAnonymously: async () => {
try {
await signInAnonymously(auth);
} catch (error) {
alert('訪客登入失敗：' + error.message);
}
},
logout: async () => {
try {
await signOut(auth);
} catch (error) {
alert('登出失敗：' + error.message);
}
}
};

onAuthStateChanged(auth, (user) => {
const authOverlay = document.getElementById('auth-overlay');
const userDisplayName = document.getElementById('user-display-name');

if (user) {
authOverlay.classList.add('hidden');
userDisplayName.textContent = user.isAnonymous ? '訪客朋友' : (user.displayName || '使用者');
} else {
authOverlay.classList.remove('hidden');
}
});
</script>
